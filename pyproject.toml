[project]
name = "gitnexus-py"
version = "0.1.0"
description = "GitNexus-style code intelligence backend (FastAPI + Neo4j + tree-sitter)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "neo4j>=5.26.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "pathspec>=0.12.0",
    "GitPython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
